name: CI/CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # Checkout the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Validate Maven project
      - name: Maven Validate
        run: mvn validate

      # Compile application
      - name: Maven Compile
        run: mvn compile

      # Run tests
      - name: Maven Test
        run: mvn test

      # Build WAR file
      - name: Maven Package
        run: mvn clean package

      # Show the generated WAR
      - name: Find WAR File
        run: |
          echo "WAR files generated:"
          find target -name "*.war" -type f

      # Save WAR as GitHub Actions artifact
      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: target/*.war
  test-dev-connection:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Test SSH Connection to DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to DEV EC2 successfully"
            echo "Hostname:"
            hostname
            echo "User:"
            whoami
            echo "Tomcat status:"
            sudo systemctl is-active tomcat10
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: train-ticket-war
          path: deploy

      - name: Check WAR File
        run: |
          echo "Downloaded files:"
          ls -lah deploy/
          echo "WAR files:"
          find deploy -name "*.war" -type f

      - name: Copy WAR to DEV
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*.war"
          target: "/home/ubuntu/"
    
      - name: Deploy WAR to DEV Tomcat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping Tomcat..."
            sudo systemctl stop tomcat10

            echo "Removing previous application..."
            sudo rm -rf /var/lib/tomcat10/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo rm -f /var/lib/tomcat10/webapps/TrainBook-1.0.0-SNAPSHOT.war

            echo "Finding downloaded WAR..."
            WAR_FILE=$(find /home/ubuntu -type f -name "*.war" | head -n 1)

            echo "WAR found at:"
            echo "$WAR_FILE"

            if [ -z "$WAR_FILE" ]; then
              echo "ERROR: WAR file was not found on DEV server"
              exit 1
            fi

            echo "Copying new WAR..."
            sudo cp "$WAR_FILE" /var/lib/tomcat10/webapps/TrainBook-1.0.0-SNAPSHOT.war

            echo "Starting Tomcat..."
            sudo systemctl start tomcat10

            echo "Checking Tomcat..."
            sudo systemctl is-active tomcat10

            echo "Waiting for application deployment..."
            sleep 10

            echo "Checking deployed files..."
            ls -lah /var/lib/tomcat10/webapps/

            echo "Checking application..."
            curl -f http://localhost:8080/TrainBook-1.0.0-SNAPSHOT/
