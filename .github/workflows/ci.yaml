name: CI/CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # Checkout the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Validate Maven project
      - name: Maven Validate
        run: mvn validate

      # Compile application
      - name: Maven Compile
        run: mvn compile

      # Run tests
      - name: Maven Test
        run: mvn test

      # Build WAR file
      - name: Maven Package
        run: mvn clean package

      # Show the generated WAR
      - name: Find WAR File
        run: |
          echo "WAR files generated:"
          find target -name "*.war" -type f

      # Save WAR as GitHub Actions artifact
      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-ticket-war
          path: target/*.war
  test-dev-connection:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Test SSH Connection to DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to DEV EC2 successfully"
            echo "Hostname:"
            hostname
            echo "User:"
            whoami
            echo "Tomcat status:"
            sudo systemctl is-active tomcat10
